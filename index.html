<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>上线通知生成插件 v3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6f7;
      padding: 16px;
      color: #1f2329;
    }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { font-size: 18px; margin-bottom: 12px; color: #1f2329; }
    .status {
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status.info { background: #e8f3ff; color: #165dff; }
    .status.success { background: #e8ffea; color: #00b42a; }
    .status.error { background: #ffece8; color: #f53f3f; }
    .status.warn { background: #fff7e8; color: #ff7d00; }
    pre {
      background: #fff;
      border: 1px solid #e5e6eb;
      border-radius: 6px;
      padding: 14px;
      font-size: 12px;
      line-height: 1.6;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-top: 12px;
      max-height: 400px;
      overflow-y: auto;
    }
    .btn {
      display: inline-block;
      padding: 8px 20px;
      background: #165dff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 8px;
    }
    .btn:hover { background: #0e42d2; }
    .btn:disabled { background: #c9cdd4; cursor: not-allowed; }
    .btn.secondary { background: #f2f3f5; color: #1f2329; }
    .btn.secondary:hover { background: #e5e6eb; }
    .log {
      font-size: 11px;
      color: #86909c;
      margin-top: 8px;
      line-height: 1.8;
    }
    .info-card {
      background: #fff;
      border: 1px solid #e5e6eb;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #4e5969;
    }
    .info-card strong { color: #1f2329; }
  </style>
</head>
<body>
  <div class="container">
    <h1>上线通知生成插件</h1>
    <div id="status" class="status info">正在加载 SDK...</div>
    <div id="infoCard" class="info-card" style="display:none;"></div>
    <div>
      <button class="btn secondary" id="copyBtn" onclick="copyResult()" disabled style="display:none;">复制内容</button>
      <button class="btn" id="retryBtn" onclick="run()" disabled style="display:none;">重新生成</button>
    </div>
    <pre id="result" style="display:none;"></pre>
    <div id="log" class="log"></div>
  </div>

  <script type="module">
    // ===== 硬编码配置（无需用户输入） =====
    const TARGET_BASE_TOKEN = 'Ik1Vw2GWMijSuOk64i1cUk0gntc';
    const TARGET_TABLE_ID = 'tbldr4KqIXdNcpBx';
    const CONTENT_FIELD_ID = 'flddFq4ORc';

    const DATA_CENTER_MAP = {
      '国内': '国内 22:00',
      '全球中心': '海外全球',
      '全球中心（欧洲）': '海外全球',
      '欧洲': '海外战区',
      '北美': '海外战区',
      '新加坡': '海外战区'
    };

    let bitable = null;
    let generatedContent = '';

    function log(msg) {
      const el = document.getElementById('log');
      el.innerHTML += '<div>' + new Date().toLocaleTimeString() + ' - ' + msg + '</div>';
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = 'status ' + (type || 'info');
    }

    function extractDateFromTableName(name) {
      const match = name.match(/(\d{2})(\d{2})(\d{2})/);
      if (match) return '20' + match[1] + '/' + match[2] + '/' + match[3];
      return '';
    }

    // ===== 复制结果 =====
    window.copyResult = function() {
      if (!generatedContent) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedContent).then(function() {
          setStatus('已复制到剪贴板', 'success');
        }).catch(function() {
          fallbackCopy();
        });
      } else {
        fallbackCopy();
      }
    };

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = generatedContent;
      ta.style.cssText = 'position:fixed;left:-9999px;';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        setStatus('已复制到剪贴板', 'success');
      } catch (e) {
        setStatus('复制失败，请手动选择内容复制', 'warn');
      }
      document.body.removeChild(ta);
    }

    // ===== 主流程 =====
    window.run = async function() {
      try {
        setStatus('正在读取数据...', 'info');
        document.getElementById('retryBtn').style.display = 'none';

        // 使用 getActiveTable() 获取当前表格（参考插件的正确用法）
        const table = await bitable.base.getActiveTable();
        const tableName = await table.getName();
        
        // 从父页面URL提取baseToken
        let baseToken = '';
        const referrer = document.referrer || (window.parent !== window ? window.parent.location.href : '');
        const urlMatch = referrer.match(/\/wiki\/([a-zA-Z0-9]+)/);
        if (urlMatch) baseToken = urlMatch[1];
        
        log('表格名称: ' + tableName + ', baseToken: ' + baseToken);

        // 显示表格信息
        const infoCard = document.getElementById('infoCard');
        infoCard.style.display = 'block';
        infoCard.innerHTML = '<strong>当前表格:</strong> ' + tableName +
          '<br><strong>日期:</strong> ' + extractDateFromTableName(tableName) +
          '<br><strong>链接:</strong> https://' + window.location.hostname + '/wiki/' + baseToken + '?table=' + (await bitable.base.getSelection()).tableId;

        // 获取字段元信息
        const fieldMetaList = await table.getFieldMetaList();
        const nameToId = new Map();
        fieldMetaList.forEach(m => nameToId.set(m.name, m.id));

        const findFieldId = (names) => {
          for (const name of names) {
            if (nameToId.has(name)) return nameToId.get(name);
          }
          return null;
        };

        const dcFid = findFieldId(['数据中心']);
        const flowFid = findFieldId(['需求FLOW', '需求flow', 'Flow']);
        const taskFid = findFieldId(['任务内容', '任务']);
        const typeFid = findFieldId(['上线类型', '类型']);
        const sysFid = findFieldId(['系统']);
        const projFid = findFieldId(['项目名称', '项目']);
        const devFid = findFieldId(['开发负责人', '开发', '负责人']);

        log('字段: 数据中心=' + dcFid + ', FLOW=' + flowFid + ', 任务=' + taskFid + ', 类型=' + typeFid + ', 系统=' + sysFid + ', 项目=' + projFid + ', 开发=' + devFid);

        // 使用 getRecordList() 获取记录（返回可迭代对象）
        const recordList = await table.getRecordList();
        const records = [];
        for (const record of recordList) {
          records.push(record);
        }
        log('读取到 ' + records.length + ' 条记录');

        if (records.length === 0) {
          setStatus('当前表格没有数据', 'warn');
          return;
        }

        // 按数据中心分组
        const groups = { '国内 22:00': [], '海外全球': [], '海外战区': [] };

        for (const record of records) {
          const recordId = record.recordId || record.id || record.record_id;
          
          // 使用 getCellString() 获取单元格值（参考插件的正确用法）
          const dcValue = dcFid ? await table.getCellString(dcFid, recordId) : '';
          const category = DATA_CENTER_MAP[dcValue] || dcValue || '其他';
          if (!groups[category]) groups[category] = [];

          const flow = flowFid ? await table.getCellString(flowFid, recordId) : '';
          const task = taskFid ? await table.getCellString(taskFid, recordId) : '';
          const typeVal = typeFid ? await table.getCellString(typeFid, recordId) : '';
          const sys = sysFid ? await table.getCellString(sysFid, recordId) : '';
          const proj = projFid ? await table.getCellString(projFid, recordId) : '';
          
          // 开发负责人可能是多选用户字段
          let devs = [];
          if (devFid) {
            const devRaw = await table.getCellString(devFid, recordId);
            // 如果是JSON数组格式，尝试解析
            try {
              const parsed = JSON.parse(devRaw);
              if (Array.isArray(parsed)) devs = parsed;
            } catch (e) {
              // 如果不是JSON，当作普通字符串
              if (devRaw) devs = [devRaw];
            }
          }

          // 格式化开发负责人
          let personTags = '';
          if (devs.length > 0) {
            personTags = devs.map(d => {
              if (typeof d === 'object' && d.id) {
                return "<person id='" + d.id + "' show_name=true show_avatar=false style='capsule'>";
              }
              return d;
            }).join(' ');
          }

          // 构建单条
          let line = '';
          if (typeVal) line += '- ' + typeVal + '：';
          line += '\n> ' + sys + "<font color='grey-500'>*（" + proj + "）*</font>";
          if (personTags) line += '- ' + personTags;

          groups[category].push({
            tag: flow ? "<a href='" + flow + "'>" + task + '</a>' : task,
            line: line
          });
        }

        // 生成 markdown
        let md = '';
        const sectionOrder = ['国内 22:00', '海外全球', '海外战区'];
        let num = 1;
        sectionOrder.forEach(section => {
          const items = groups[section];
          if (!items || items.length === 0) return;
          md += '**' + section + '：**\n\n';
          items.forEach(item => {
            md += num + '. ' + item.tag + '\n' + item.line + '\n\n';
            num++;
          });
        });

        generatedContent = md.trim();

        // 显示结果
        const resultEl = document.getElementById('result');
        resultEl.style.display = 'block';
        resultEl.textContent = generatedContent;

        // 自动复制
        window.copyResult();

        setStatus('生成完成，共 ' + records.length + ' 条记录，内容已自动复制', 'success');
        document.getElementById('copyBtn').style.display = 'inline-block';
        document.getElementById('copyBtn').disabled = false;
        document.getElementById('retryBtn').style.display = 'inline-block';
        log('通知内容生成完成');
      } catch (err) {
        setStatus('执行失败: ' + err.message, 'error');
        log('错误: ' + err.stack);
        document.getElementById('retryBtn').style.display = 'inline-block';
      }
    };

    // ===== SDK 加载 =====
    async function loadSDK() {
      // 方案1: 检查是否已由飞书父页面注入
      if (window.bitable) {
        log('SDK 已由父页面注入');
        bitable = window.bitable;
        return true;
      }

      // 方案2: 从 CDN 动态加载 ESM
      const cdns = [
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@0.3.2/dist/index.mjs',
        'https://unpkg.com/@lark-base-open/js-sdk@0.3.2/dist/index.mjs',
        'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@latest/dist/index.mjs'
      ];

      for (const cdn of cdns) {
        try {
          log('尝试加载: ' + cdn);
          const mod = await import(cdn);
          if (mod && mod.bitable) {
            bitable = mod.bitable;
            log('SDK 加载成功 (from ' + cdn + ')');
            return true;
          }
        } catch (e) {
          log('CDN 加载失败: ' + e.message);
        }
      }

      return false;
    }

    // ===== 初始化 =====
    async function init() {
      const loaded = await loadSDK();
      if (loaded) {
        setStatus('SDK 加载成功，正在读取数据...', 'info');
        // 稍等一下再执行，确保 SDK 完全就绪
        setTimeout(() => { run(); }, 300);
      } else {
        setStatus('SDK 加载失败，请检查网络或联系管理员', 'error');
        log('所有 CDN 均无法加载 SDK，可能被飞书安全策略拦截');
      }
    }

    init();
  </script>
</body>
</html>
