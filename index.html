<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>上线通知生成插件</title>
  <style>*{box-sizing:border-box;margin:0;padding:0}body{color:#1f2329;background:#f5f6f7;padding:16px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}.container{max-width:700px;margin:0 auto}h1{color:#1f2329;margin-bottom:12px;font-size:18px}.status{border-radius:6px;margin-bottom:12px;padding:10px 14px;font-size:13px;line-height:1.5}.status.info{color:#165dff;background:#e8f3ff}.status.success{color:#00b42a;background:#e8ffea}.status.error{color:#f53f3f;background:#ffece8}.status.warn{color:#ff7d00;background:#fff7e8}pre{white-space:pre-wrap;word-wrap:break-word;background:#fff;border:1px solid #e5e6eb;border-radius:6px;max-height:400px;margin-top:12px;padding:14px;font-size:12px;line-height:1.6;overflow:auto}.btn{color:#fff;cursor:pointer;background:#165dff;border:none;border-radius:6px;margin-top:8px;margin-right:8px;padding:8px 20px;font-size:13px;display:inline-block}.btn:hover{background:#0e42d2}.btn:disabled{cursor:not-allowed;background:#c9cdd4}.btn.secondary{color:#1f2329;background:#f2f3f5}.btn.secondary:hover{background:#e5e6eb}.btn.success{background:#00b42a}.btn.success:hover{background:#009a24}.log{color:#86909c;margin-top:8px;font-size:11px;line-height:1.8}.info-card{color:#4e5969;background:#fff;border:1px solid #e5e6eb;border-radius:6px;margin-bottom:12px;padding:12px;font-size:12px}.info-card strong{color:#1f2329}.settings-panel{background:#fff;border:1px solid #e5e6eb;border-radius:6px;margin-bottom:12px;padding:14px;display:none}.settings-panel h3{color:#1f2329;margin-bottom:10px;font-size:14px}.settings-panel label{color:#4e5969;margin-top:8px;margin-bottom:4px;font-size:12px;display:block}.settings-panel input{border:1px solid #e5e6eb;border-radius:4px;outline:none;width:100%;padding:6px 10px;font-size:12px}.settings-panel input:focus{border-color:#165dff}.settings-panel .hint{color:#86909c;margin-top:6px;font-size:11px;line-height:1.6}</style>
  <script type="module" crossorigin src="./assets/index-CN71jmhy.js"></script>
</head>
<body>
  <div class="container">
    <h1>上线通知生成插件</h1>
    <div id="status" class="status info">正在加载 SDK...</div>
    
    <div class="settings-panel" id="settingsPanel">
      <h3>飞书应用凭证（用于写入目标表）</h3>
      <label>App ID</label>
      <input type="text" id="appIdInput" placeholder="cli_xxxxxxxxxxxxxxxx">
      <label>App Secret</label>
      <input type="password" id="appSecretInput" placeholder="xxxxxxxxxxxxxxxxxxxxxxxx">
      <div class="hint">
        需要在飞书开放平台创建应用，获取 App ID 和 App Secret。<br>
        应用需要开通"多维表格"权限，并被授权访问目标表格。
      </div>
    </div>
    
    <div id="infoCard" class="info-card" style="display:none;"></div>
    <div>
      <button class="btn secondary" id="copyBtn" onclick="copyResult()" disabled style="display:none;">复制内容</button>
      <button class="btn success" id="writeBtn" onclick="writeToTarget()" disabled style="display:none;">写入目标表</button>
      <button class="btn" id="retryBtn" onclick="run()" disabled style="display:none;">重新生成</button>
      <button class="btn secondary" onclick="toggleSettings()">设置</button>
    </div>
    <pre id="result" style="display:none;"></pre>
    <div id="log" class="log"></div>
  </div>
</body>
</html>
